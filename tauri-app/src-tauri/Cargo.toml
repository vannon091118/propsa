[package]
name = "propsa"
version = "0.0.17"
description = "PROPSA — Projekt-Scankontext als Kontextpaket (Tauri v2 + React)"
authors = ["Vannon"]
edition = "2021"

[lib]
name = "propsa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Schaltet die Produktions-Assets frei: Ohne dieses Feature behandelt
# generate_context! jeden Build (auch --release) als Dev-Build und bündelt
# die devUrl (localhost:1420) statt ../dist — die Exe zeigt dann nur
# Verbindungsfehler. Immer mit `cargo build --release --features custom-protocol`
# bauen; `npm run tauri build` setzt das Feature selbst.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
# Scan-Zwischenspeicher und Live-Modus: gebündelte SQLite ohne System-Abhängigkeit.
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
dirs = "5"
# LLM-Beratungsbrücke: kleiner HTTPS-Client ohne Async-Laufzeit.
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
