[package]
name = "propsa"
version = "0.0.14"
description = "PROPSA — Projekt-Scankontext als Kontextpaket (Tauri v2 + React)"
authors = ["Vannon"]
edition = "2021"

[lib]
name = "propsa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
# Scan-Zwischenspeicher und Live-Modus: gebündelte SQLite ohne System-Abhängigkeit.
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
dirs = "5"

[dev-dependencies]
tempfile = "3"
