# Gestufte Prüfung – bei jedem Push auf einen Branch, gestaffelt nach Aufwand.
#
# Stufen, jede für sich lauffähig (die Reihenfolge ist die Abhängigkeit,
# nicht eine Kette von Hand):
#   tier     – Wächter, ~4 s. Bricht ab, bevor eine Minute angefordert wird.
#   regeln   – `npm run pruefen`, wenige Sekunden.
#   tests    – die vier ts-node-Tests als Matrix, parallel statt nacheinander.
#   aenderung – entscheidet per git diff, ob Rust oder Frontend betroffen sind.
#   nsis     – übersetzt und bündelt nur, wenn Stage 4 `true` meldet.
#
# Warum gestuft: ein reiner Doku-Commit soll Sekunden kosten, nicht acht
# Minuten. Die Übersetzung ist der einzige teure Schritt, und sie lohnt nur,
# wenn sich Rust- oder Frontend-Quellen geändert haben.
#
# Kosten: GitHub-hosted Runner sind für öffentliche Repositories gratis und
# unbegrenzt – auf allen drei Betriebssystemen. Für private Repositories
# rechnet GitHub ein Monatskontingent ab, und selbst gestellte Runner kosten
# seit dem 1. März 2026 0,002 USD je Minute. Deshalb bricht Stage 1 ab, sobald
# das Repository privat ist, statt heimlich Kontingent zu verbrauchen.
#
# Der Push auf einen Tag löst diesen Workflow nicht aus (`branches` ohne
# `tags`), sonst liefe er beim Release zweimal.

name: Prüfung (Entwurf)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Push macht einen laufenden Lauf überflüssig; ohne das verbraucht
# jeder zusätzliche Push eine volle Runner-Minute für ein Ergebnis, das
# niemand mehr öffnet.
concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier:
    name: Tier prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Sichtbarkeit melden
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "privat: ${{ github.event.repository.private }}"
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "::error::Privates Repository. GitHub-hosted Runner sind im Free-Tier dann nicht unbegrenzt, sondern anteilig an einem Monatskontingent. Der Lauf bricht ab, damit keine Minuten verbraucht werden. Für ein öffentliches Repository ist derselbe Lauf kostenlos."
            exit 1
          fi
          echo "Öffentliches Repository – der Lauf ist kostenlos."

  regeln:
    name: Regeln
    needs: tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        run: npm install
      - name: Konsistenz prüfen
        run: npm run pruefen

  tests:
    name: Test (${{ matrix.test }})
    needs: regeln
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `vertrag.test.ts` fehlte hier bisher in beiden Workflows und war
        # damit nirgends belegt – dieselbe stille Zusage wie eine Funktion
        # ohne Aufrufer.
        test: [paketKritik, zwischenspeicher, updateFehler, vertrag]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        run: npm install
      # `vertrag.test.ts` braucht wie `zwischenspeicher.test.ts` den gebauten
      # Core: `@propakt/core` wird über dist/ aufgelöst.
      - name: Core bauen
        run: npm run build --workspace @propakt/core
      - name: Test ausführen
        run: npx ts-node tests/${{ matrix.test }}.test.ts

  aenderung:
    name: Betroffene Quellen
    needs: tier
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust- oder Frontend-Quellen berührt?
        id: diff
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Vergleich: origin/main...HEAD"
          geaendert=$(git diff --name-only "origin/main...HEAD" || true)
          echo "Geänderte Dateien:"
          echo "$geaendert" | sed 's/^/  /'
          if echo "$geaendert" | grep -qE '^(tauri-app/src-tauri/|tauri-app/src/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Übersetzung nötig."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Nur Dokumentation oder Werkzeugpfade – die Übersetzung entfällt."
          fi

  nsis:
    name: NSIS bauen
    needs: [regeln, tests, aenderung]
    if: needs.aenderung.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren (Wurzel)
        run: npm install

      - name: Frontend-Abhängigkeiten installieren
        run: npm install
        working-directory: tauri-app

      - uses: dtolnay/rust-toolchain@stable

      # `shared-key` ist der eigentliche Hebel: ohne ihn legt die Aktion
      # einen je Branch und Profil eigenen Schlüssel an, und der Lauf auf dem
      # Arbeitszweig findet den Cache des Hauptzweigs nicht – er übersetzt
      # dann jedes Mal alle Abhängigkeiten von Grund auf. Die 4 Sekunden
      # Restore im ersten Lauf waren genau das.
      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri
          shared-key: propakt-rust

      - name: Installer bauen
        run: npm run tauri build
        working-directory: tauri-app

      - name: Installer einsammeln
        shell: bash
        run: |
          mkdir -p out
          find tauri-app/src-tauri/target/release/bundle/nsis -type f -name '*.exe' -exec cp {} out/ \;
          find tauri-app/src-tauri/target/release/bundle/msi -type f -name '*.msi' -exec cp {} out/ \;
          ls -la out/
          if [ -z "$(ls -A out)" ]; then
            echo "::error::Kein Installer im Bundle-Ordner – der Build lief durch, ohne ein Artefakt zu erzeugen."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: propakt-entwurf-${{ github.sha }}
          path: out/*
          retention-days: 7
          if-no-files-found: error
