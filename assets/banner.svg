<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1020"/>
      <stop offset="100%" stop-color="#191f37"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4aa3ff"/>
      <stop offset="100%" stop-color="#1e5bff"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fcaff"/>
      <stop offset="100%" stop-color="#3a7eff"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="400" rx="28" fill="url(#bg)"/>

  <!-- Background decoration -->
  <circle cx="120" cy="80" r="140" fill="#4aa3ff" opacity="0.08"/>
  <circle cx="1280" cy="320" r="180" fill="#1e5bff" opacity="0.1"/>

  <!-- File lines -->
  <g transform="translate(60,70)">
    <rect x="0" y="0" width="180" height="10" rx="3" fill="url(#accent)"/>
    <rect x="150" y="0" width="60" height="10" rx="3" fill="#ffffff" opacity="0.35"/>
    <rect x="0" y="22" width="120" height="10" rx="3" fill="url(#soft)" opacity="0.8"/>
    <rect x="90" y="22" width="100" height="10" rx="3" fill="#ffffff" opacity="0.25"/>
    <rect x="0" y="44" width="220" height="10" rx="3" fill="#ffffff" opacity="0.5"/>
    <rect x="0" y="66" width="150" height="10" rx="3" fill="url(#soft)" opacity="0.6"/>
    <rect x="0" y="88" width="200" height="10" rx="3" fill="#ffffff" opacity="0.4"/>
    <rect x="0" y="110" width="110" height="10" rx="3" fill="url(#accent)" opacity="0.7"/>
  </g>

  <!-- Second file stack -->
  <g transform="translate(280,120)">
    <rect x="0" y="0" width="220" height="12" rx="3" fill="url(#soft)"/>
    <rect x="220" y="-4" width="12" height="20" fill="#ffffff" opacity="0.3"/>
    <rect x="0" y="20" width="180" height="12" rx="3" fill="#ffffff" opacity="0.45"/>
    <rect x="180" y="16" width="12" height="20" fill="#ffffff" opacity="0.3"/>
    <rect x="0" y="40" width="240" height="12" rx="3" fill="url(#accent)"/>
    <rect x="240" y="36" width="12" height="20" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Terminal-ish box -->
  <rect x="560" y="60" width="360" height="280" rx="12" fill="#070a16" opacity="0.9"/>
  <rect x="560" y="60" width="360" height="32" fill="#10162c"/>
  <circle cx="578" cy="76" r="5" fill="#ff5c5c"/>
  <circle cx="596" cy="76" r="5" fill="#ffbd2e"/>
  <circle cx="614" cy="76" r="5" fill="#3fb950"/>
  <rect x="660" y="150" width="260" height="10" rx="3" fill="#ffffff" opacity="0.4"/>
  <rect x="580" y="180" width="200" height="10" rx="3" fill="#ffffff" opacity="0.25"/>
  <rect x="580" y="200" width="240" height="10" rx="3" fill="#ffffff" opacity="0.25"/>
  <rect x="580" y="220" width="160" height="10" rx="3" fill="#ffffff" opacity="0.25"/>
  <rect x="580" y="240" width="220" height="10" rx="3" fill="#ffffff" opacity="0.25"/>
  <rect x="580" y="260" width="120" height="10" rx="3" fill="#ffffff" opacity="0.25"/>
  <text x="660" y="330" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#7fcaff" text-anchor="middle">scan · filter · export</text>

  <!-- Big title -->
  <text x="980" y="120" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1">PROPSA</text>
  <text x="980" y="170" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#9bb8ff">CLI + Tauri GUI · Projekt-Kontext für LLMs</text>

  <!-- accent shape -->
  <path d="M 980 200 L 1200 260 L 980 320 Z" fill="url(#accent)" opacity="0.25"/>
  <rect x="970" y="330" width="480" height="8" rx="4" fill="url(#accent)" opacity="0.6"/>

  <!-- tags -->
  <g transform="translate(980,360)" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#9bb8ff">
    <rect x="0" y="-14" width="70" height="22" rx="6" fill="#1e5bff" opacity="0.35"/>
    <text x="35" y="2" text-anchor="middle">TypeScript</text>
    <rect x="84" y="-14" width="50" height="22" rx="6" fill="#1e5bff" opacity="0.35"/>
    <text x="109" y="2" text-anchor="middle">Rust</text>
    <rect x="148" y="-14" width="46" height="22" rx="6" fill="#1e5bff" opacity="0.35"/>
    <text x="171" y="2" text-anchor="middle">React</text>
    <rect x="208" y="-14" width="52" height="22" rx="6" fill="#1e5bff" opacity="0.35"/>
    <text x="234" y="2" text-anchor="middle">Tauri</text>
  </g>

  <text x="60" y="390" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8c9dc7">Scan · Filtern · Kontext · Export</text>
</svg>
