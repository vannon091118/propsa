<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#151c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5cb3ff"/>
      <stop offset="100%" stop-color="#2f6bff"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="90" cy="40" r="150" fill="#4aa3ff" opacity="0.07"/>
  <circle cx="1330" cy="370" r="170" fill="#1e5bff" opacity="0.09"/>

  <!-- Links: ein Riesenblock, daneben dieselbe Menge als getrennte Dateien -->
  <g transform="translate(64,104)">
    <rect x="0" y="0" width="150" height="192" rx="12" fill="#ffffff" opacity="0.05"/>
    <rect x="0" y="0" width="150" height="192" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
    <g fill="#ffffff">
      <rect x="18" y="20" width="114" height="7" rx="3" opacity="0.16"/>
      <rect x="18" y="38" width="98" height="7" rx="3" opacity="0.13"/>
      <rect x="18" y="56" width="122" height="7" rx="3" opacity="0.16"/>
      <rect x="18" y="74" width="86" height="7" rx="3" opacity="0.13"/>
      <rect x="18" y="92" width="110" height="7" rx="3" opacity="0.16"/>
      <rect x="18" y="110" width="92" height="7" rx="3" opacity="0.13"/>
      <rect x="18" y="128" width="118" height="7" rx="3" opacity="0.16"/>
      <rect x="18" y="146" width="80" height="7" rx="3" opacity="0.13"/>
      <rect x="18" y="164" width="104" height="7" rx="3" opacity="0.16"/>
    </g>
    <text x="75" y="188" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8c9dc7" text-anchor="middle" opacity="0.8">ein Blob</text>
  </g>

  <!-- Pfeil -->
  <g stroke="#5cb3ff" stroke-width="2.5" fill="none" opacity="0.75">
    <path d="M 232 200 L 268 200"/>
    <path d="M 258 191 L 268 200 L 258 209" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Rechts: getrennte Domain-Dateien -->
  <g transform="translate(288,104)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <g>
      <rect x="0" y="0" width="176" height="54" rx="10" fill="#0d1428" stroke="#5cb3ff" stroke-opacity="0.45"/>
      <rect x="0" y="0" width="4" height="54" rx="2" fill="url(#accent)"/>
      <text x="18" y="24" font-size="12" fill="#cfe0ff">src.md</text>
      <rect x="18" y="34" width="120" height="5" rx="2" fill="#ffffff" opacity="0.22"/>
    </g>
    <g>
      <rect x="0" y="69" width="176" height="54" rx="10" fill="#0d1428" stroke="#5cb3ff" stroke-opacity="0.45"/>
      <rect x="0" y="69" width="4" height="54" rx="2" fill="url(#accent)"/>
      <text x="18" y="93" font-size="12" fill="#cfe0ff">docs.md</text>
      <rect x="18" y="103" width="96" height="5" rx="2" fill="#ffffff" opacity="0.22"/>
    </g>
    <g>
      <rect x="0" y="138" width="176" height="54" rx="10" fill="#0d1428" stroke="#5cb3ff" stroke-opacity="0.45"/>
      <rect x="0" y="138" width="4" height="54" rx="2" fill="url(#accent)"/>
      <text x="18" y="162" font-size="12" fill="#cfe0ff">tauri-app.md</text>
      <rect x="18" y="172" width="134" height="5" rx="2" fill="#ffffff" opacity="0.22"/>
    </g>
  </g>

  <!-- Trennlinie -->
  <line x1="540" y1="72" x2="540" y2="328" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>

  <!-- Wortmarke -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="600" y="176" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1.5">PROPAKT</text>
    <rect x="602" y="196" width="84" height="6" rx="3" fill="url(#accent)"/>

    <text x="600" y="240" font-size="23" font-weight="500" fill="#9bb8ff">Kontextpakete für Sprachmodelle</text>
    <text x="600" y="270" font-size="15" fill="#8c9dc7">CLI · Tauri-Desktop-App · Live-Modus · LLM-Beratung</text>

    <text x="600" y="316" font-size="16" font-weight="600" fill="#e8eefc">vollständig · geordnet · ehrlich</text>
  </g>

  <!-- Technologie-Marken -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9bb8ff">
    <rect x="600" y="336" width="86" height="26" rx="7" fill="#2f6bff" opacity="0.3"/>
    <text x="643" y="353" text-anchor="middle">TypeScript</text>
    <rect x="696" y="336" width="52" height="26" rx="7" fill="#2f6bff" opacity="0.3"/>
    <text x="722" y="353" text-anchor="middle">Rust</text>
    <rect x="758" y="336" width="54" height="26" rx="7" fill="#2f6bff" opacity="0.3"/>
    <text x="785" y="353" text-anchor="middle">React</text>
    <rect x="822" y="336" width="52" height="26" rx="7" fill="#2f6bff" opacity="0.3"/>
    <text x="848" y="353" text-anchor="middle">Tauri</text>
  </g>
</svg>
